<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Minha dieta</title>
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#0E6F63">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Dieta">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#EEF3F0;--surface:#fff;--ink:#12201A;--muted:#5C6B64;--line:#D6E0DA;--accent:#0E6F63;--accent-ink:#fff;--p:#D8453F;--c:#2F5DE0;--f:#E0A800;--over:#C0392B;--track:#DCE6E0;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0E1713;--surface:#16231D;--ink:#E8F0EB;--muted:#8FA298;--line:#2A3B33;--accent:#4FC3AF;--accent-ink:#06201B;--p:#FF7A70;--c:#7B9BFF;--f:#F2C94C;--over:#FF7A6B;--track:#24352D;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0E1713;--surface:#16231D;--ink:#E8F0EB;--muted:#8FA298;--line:#2A3B33;--accent:#4FC3AF;--accent-ink:#06201B;--p:#FF7A70;--c:#7B9BFF;--f:#F2C94C;--over:#FF7A6B;--track:#24352D;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 "Schibsted Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:520px;margin:0 auto;padding:16px 16px 48px}
.nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.nav b{font-size:17px;font-weight:700}
button{font:inherit;color:inherit;cursor:pointer}
