<style>
:root{--bg:#EEF3F0;--surface:#fff;--ink:#12201A;--muted:#5C6B64;--line:#D6E0DA;--accent:#0E6F63;--accent-ink:#fff;--p:#D8453F;--c:#2F5DE0;--f:#E0A800;--over:#C0392B;--track:#DCE6E0;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0E1713;--surface:#16231D;--ink:#E8F0EB;--muted:#8FA298;--line:#2A3B33;--accent:#4FC3AF;--accent-ink:#06201B;--p:#FF7A70;--c:#7B9BFF;--f:#F2C94C;--over:#FF7A6B;--track:#24352D;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0E1713;--surface:#16231D;--ink:#E8F0EB;--muted:#8FA298;--line:#2A3B33;--accent:#4FC3AF;--accent-ink:#06201B;--p:#FF7A70;--c:#7B9BFF;--f:#F2C94C;--over:#FF7A6B;--track:#24352D;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 "Schibsted Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:520px;margin:0 auto;padding:16px 16px 48px}
.nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.nav b{font-size:17px;font-weight:700}
button{font:inherit;color:inherit;cursor:pointer}
.ic{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font-size:20px}
.ic:focus-visible,.btn:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.hero{padding:12px 0 18px}
